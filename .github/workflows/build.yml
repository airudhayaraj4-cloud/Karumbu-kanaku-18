name: Build Android APK (கரும்பு கணக்கு)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          STANDALONE_USED=false
          if [ -f "index.html" ] && [ $(wc -c < "index.html") -gt 50000 ]; then
            cp -f index.html www/index.html
            STANDALONE_USED=true
          elif [ -f "offline-apk/index.html" ] && [ $(wc -c < "offline-apk/index.html") -gt 50000 ]; then
            cp -f offline-apk/index.html www/index.html
            STANDALONE_USED=true
          fi
          if [ "$STANDALONE_USED" = false ]; then
            if [ -f "index.html" ]; then
              cp index.html www/index.html
            fi
          fi

      - name: Setup Capacitor Android
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.karumbukanakku.app",
            "appName": "கரும்பு கணக்கு",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android

      - name: Configure Android App
        run: |
          RUN_NUM="${{ github.run_number }}"
          AUTO_VERSION_CODE=$((200 + RUN_NUM))
          AUTO_VERSION_NAME="1.3.${RUN_NUM}"
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i "s/versionCode 1/versionCode $AUTO_VERSION_CODE/g" "$BUILD_GRADLE"
            sed -i "s/versionName \"1.0\"/versionName \"$AUTO_VERSION_NAME\"/g" "$BUILD_GRADLE"
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karumbu-kanakku-v1.3-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
